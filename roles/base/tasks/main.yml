- name: Create a user
  ansible.builtin.user:
    name: jari
    groups: root
  tags: always

- name: Add sudoers file for jari
  ansible.builtin.copy:
    src: sudoer_jari
    dest: /etc/sudoers.d/jari
    owner: root
    group: root
    mode: '0440'
  tags: always

- name: Add ssh key for jari
  ansible.builtin.authorized_key:
    user: jari
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBeQqXvD/TfJf5TRuy/U+1P/idBwGEhfO4HMY7f74Y/A marco@ubu26svrws" 
  tags: always


