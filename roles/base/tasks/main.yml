- name: configure openssh based on a template
  ansible.builtin.template:
    src: "{{ ssh_template_file }}"
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644' # Tip: zet rechten altijd tussen aanhalingstekens om octale conversiefouten te voorkomen
    validate: /usr/sbin/sshd -t -f %s # <--- DIT REDT JE LEVEN IN DE TOEKOMST!
  notify: restart_sshd

