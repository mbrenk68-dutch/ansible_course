- name: install apache on webservers
  ansible.builtin.package:
    name: "{{ apache_package }}"
    state: present

- name: ensure package is running
  ansible.builtin.service:
    name: "{{ apache_service }}"
    state: started

- name: change email address for ServiceAdmin
  tags: apache,fedora
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^ServerAdmin'
    line: ServerAdmin marcovanbrenk@pm.me
  when: ansible_facts['distribution'] == "Fedora"
  notify: restart_apache
